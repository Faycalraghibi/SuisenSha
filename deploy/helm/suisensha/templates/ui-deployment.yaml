apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "suisensha.fullname" . }}-ui
  labels:
    {{- include "suisensha.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  {{- if not .Values.ui.autoscaling.enabled }}
  replicas: {{ .Values.ui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "suisensha.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "suisensha.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.service.targetPort }}
              protocol: TCP
          env:
            - name: API_URL
              value: "http://{{ include "suisensha.fullname" . }}-api:{{ .Values.api.service.port }}"
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
