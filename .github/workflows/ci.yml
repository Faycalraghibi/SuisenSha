name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run clean setup
        run: |
          chmod +x clean_setup.sh
          bash clean_setup.sh

      - name: Run pre-commit hooks
        run: |
          source suisensha-venv/bin/activate
          pre-commit run --all-files

      - name: Run pip-audit security scan
        run: |
          source suisensha-venv/bin/activate
          pip-audit

  test:
    name: Tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run clean setup (Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x clean_setup.sh
          bash clean_setup.sh

      - name: Run clean setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\clean_setup.ps1

      - name: Run test suite with coverage (Linux)
        if: runner.os != 'Windows'
        run: |
          source suisensha-venv/bin/activate
          python -m pytest tests/ -v --tb=short

      - name: Run test suite with coverage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\suisensha-venv\Scripts\Activate.ps1
          python -m pytest tests/ -v --tb=short

  docker-scan:
    name: Docker Build & Trivy Scan
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t suisensha:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: suisensha:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
