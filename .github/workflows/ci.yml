name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run clean setup
        run: |
          chmod +x clean_setup.sh
          bash clean_setup.sh

      - name: Run pre-commit hooks
        run: |
          source suisensha-venv/bin/activate
          pre-commit run --all-files

      - name: Run pip-audit security scan
        run: |
          source suisensha-venv/bin/activate
          pip-audit

      - name: Run type check with installed dependencies
        run: |
          source suisensha-venv/bin/activate
          mypy --config-file=pyproject.toml src/

  test:
    name: Tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run clean setup (Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x clean_setup.sh
          bash clean_setup.sh

      - name: Run clean setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\clean_setup.ps1

      - name: Run test suite with coverage (Linux)
        if: runner.os != 'Windows'
        run: |
          source suisensha-venv/bin/activate
          python -m pytest tests/ -v --tb=short

      - name: Run test suite with coverage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\suisensha-venv\Scripts\Activate.ps1
          python -m pytest tests/ -v --tb=short

  docker-scan:
    name: Docker Build & Trivy Scan
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t suisensha:${{ github.sha }} .

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.69.3/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.3

      - name: Run Trivy vulnerability scan
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --pkg-types os,library --format json -o trivy.json suisensha:${{ github.sha }} || true
          python3 -c "import json; [print('FINDING:', r.get('Target'), v.get('PkgName'), v.get('InstalledVersion'), v.get('PkgPath')) for r in json.load(open('trivy.json')).get('Results', []) for v in r.get('Vulnerabilities', [])]" || true
          trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --pkg-types os,library --format table suisensha:${{ github.sha }}
